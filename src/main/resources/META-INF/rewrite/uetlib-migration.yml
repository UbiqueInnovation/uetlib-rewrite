---
type: specs.openrewrite.org/v1beta/recipe
name: ch.uetlib.MigratePackages
displayName: Migrate uetlib Java packages
description: Move legacy and intermediate uetlib Java types to module-owned namespaces, updating class-name strings and resource references while preserving configuration keys.
recipeList:
  - org.openrewrite.java.ChangePackage:
      oldPackageName: com.den_4.inotify_java
      newPackageName: ch.uetlib.inotify
      recursive: true
  - org.openrewrite.java.ChangePackage:
      oldPackageName: ch.ubique.uetlib
      newPackageName: ch.uetlib
      recursive: true
  - org.openrewrite.java.ChangePackage:
      oldPackageName: ch.ubique.backend
      newPackageName: ch.uetlib
      recursive: true
  - org.openrewrite.java.ChangePackage:
      oldPackageName: ch.ubique.datatrans
      newPackageName: ch.uetlib.payment.datatrans.client
      recursive: true
  - org.openrewrite.java.ChangePackage:
      oldPackageName: ch.uetlib.spring.boot.geo
      newPackageName: ch.uetlib.geo.spring.boot
      recursive: true
  - ch.uetlib.rewrite.MigrateOwnedTypes
  - ch.uetlib.rewrite.MigrateClassReferences
  - ch.uetlib.rewrite.MigrateResourceReferences
---
type: specs.openrewrite.org/v1beta/recipe
name: ch.uetlib.MigrateToPublicUetlib
displayName: Migrate to public uetlib releases
description: Update Maven coordinates and release versions, Java packages and resource references for the first public uetlib releases. Projects on Spring Boot's starter-parent move to the uetlib starter-parent. Projects outside uetlib move their uetlib parent to the Ubique-internal parent.
recipeList:
  - ch.uetlib.rewrite.RequireUetlibParent
  - ch.uetlib.rewrite.RemoveRedundantUetlibManagement
  - ch.uetlib.rewrite.MigrateSpringBootStarterParent
  - ch.uetlib.rewrite.MigrateMavenCoordinates
  - ch.uetlib.rewrite.MigrateConfigurationProperties
  - ch.uetlib.MigratePackages
